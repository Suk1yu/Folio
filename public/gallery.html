    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "accent-indigo": "#1a1b22",
                        "accent-link": "#2563eb",
                        "on-surface": "#1a1b22",
                        "on-surface-variant": "#47464b",
                        "surface": "#ffffff",
                        "background": "#FFFFFF",
                        "surface-container-low": "#f4f2fd",
                        "text-muted": "#A1A1AA",
                        "surface-variant": "#e3e1ec",
                        "outline-variant": "#c8c5cb",
                        "error": "#ba1a1a",
                        "secondary": "#4b41e1"
                    },
                    "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" },
                    "spacing": { "max-width": "768px", "unit": "4px", "gutter": "24px", "section-gap": "80px", "margin-safe": "32px" },
                    "fontFamily": { "headline-md": ["Geist"], "body-md": ["Geist"], "label-sm": ["JetBrains Mono"] },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "1.6", "letterSpacing": "0em", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "500" }],
                        "label-sm": ["13px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>

<body id="page-gallery" class="bg-background text-on-surface font-body-md text-body-md antialiased min-h-screen flex flex-col">
    <header class="bg-background w-full">
        <div class="max-w-[768px] lg:max-w-[960px] mx-auto px-margin-safe pt-section-gap flex items-start justify-between gap-4">
            <div class="flex flex-col items-start gap-4">
                <h1 id="admin-trigger" class="font-headline-md text-headline-md font-medium text-on-surface select-none">Hai, I'm Fardhan 👋</h1>
                <nav aria-label="Main Navigation" class="flex items-center gap-gutter">
                    <a class="font-body-md text-body-md text-text-muted hover:text-primary transition-colors duration-200" href="index.html">Present</a>
                    <a class="font-body-md text-body-md text-text-muted hover:text-primary transition-colors duration-200" href="timeline.html">Timeline</a>
                    <a class="font-body-md text-body-md text-on-surface font-medium opacity-70" href="gallery.html">Gallery</a>
                    <a class="font-body-md text-body-md text-text-muted hover:text-primary transition-colors duration-200" href="log-devs.html">Log Devs</a>
                </nav>
            </div>
            <button id="add-new-btn" class="hidden shrink-0 items-center gap-1.5 font-label-sm text-label-sm text-accent-indigo border border-accent-indigo/30 hover:bg-accent-indigo/5 transition-colors duration-200 rounded-lg px-3 py-1.5 mt-1">
                <span class="material-symbols-outlined" style="font-size: 16px;">add</span>
                Add new
            </button>
        </div>
    </header>

    <main class="flex-grow max-w-[768px] lg:max-w-[1100px] mx-auto w-full px-margin-safe py-section-gap">
        <div id="gallery-grid" class="bento-grid"></div>
    </main>

    <!-- ===== Modal: Add Gallery Image ===== -->
    <div id="upload-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="flex items-center justify-between mb-5">
                <h2 class="font-headline-md text-lg font-medium text-on-surface">Add new image</h2>
                <button id="modal-close" class="text-text-muted hover:text-on-surface transition-colors">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div id="dropzone" class="dropzone">
                <input accept="image/*" class="hidden" id="file-input" type="file"/>
                <p id="dropzone-label" class="font-body-md text-sm text-text-muted">Klik atau seret gambar ke sini</p>
                <img id="preview-img" class="hidden mt-3 max-h-40 mx-auto rounded" src=""/>
            </div>
            <div class="flex justify-end gap-2 mt-5">
                <button id="modal-cancel" class="font-body-md text-sm px-4 py-2 rounded-lg text-text-muted hover:bg-surface-container-low transition-colors" type="button">Cancel</button>
                <button id="upload-submit" class="font-body-md text-sm px-4 py-2 rounded-lg bg-accent-indigo text-white hover:bg-secondary transition-colors disabled:opacity-40 disabled:cursor-not-allowed" disabled type="button">Upload</button>
            </div>
        </div>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/admin-shared.js"></script>
    <script>
        const gridEl = document.getElementById('gallery-grid');
        const addNewBtn = document.getElementById('add-new-btn');
        const modal = document.getElementById('upload-modal');
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('file-input');
        const previewImg = document.getElementById('preview-img');
        const dropzoneLabel = document.getElementById('dropzone-label');
        const uploadBtn = document.getElementById('upload-submit');

        let selectedFile = null;

        try {
            setupAdminToggle('admin-trigger');
            if (isAdminMode()) {
                addNewBtn.classList.remove('hidden');
                addNewBtn.classList.add('flex');
            }
        } catch (err) {
            console.error('Gagal setup admin toggle (halaman tetap jalan normal):', err);
        }

        // Ikon dipakai dari ICONS bersama di admin-shared.js.

        let currentItems = []; // disimpan untuk keperluan reorder

        function renderGallery(items) {
            const visible = items.filter(i => !i.deleted);
            currentItems = visible;
            gridEl.innerHTML = '';

            if (visible.length === 0) {
                gridEl.style.display = 'block';
                gridEl.innerHTML = `<p class="font-body-md text-text-muted py-8 text-center">Belum ada gambar. ${isAdminMode() ? 'Klik "Add new" untuk mulai.' : ''}</p>`;
                return;
            }
            gridEl.style.display = 'grid';

            visible.forEach((item, index) => {
                const cell = document.createElement('div');
                cell.className = 'bento-item animate-fade-in-up';
                cell.style.animationDelay = `${Math.min(index * 60, 400)}ms`;
                cell.dataset.pos = index % 8;
                cell.dataset.id = item.id;

                const myReaction = getLocalReaction(`gallery_items:${item.id}`);
                const disabledUp = index === 0 ? 'disabled' : '';
                const disabledDown = index === visible.length - 1 ? 'disabled' : '';

                cell.innerHTML = `
                    <img alt="Gallery image" loading="lazy" src="${escapeAttr(item.imageUrl)}"/>
                    <button class="gallery-fullscreen-btn" data-fullscreen title="Lihat penuh">${ICONS.fullscreen}</button>
                    ${isAdminMode() ? `
                        <div class="admin-delete-overlay">
                            <button class="order-btn-grid" data-move="up" data-index="${index}" title="Naikkan" ${disabledUp}>${ICONS.up}</button>
                            <button class="order-btn-grid" data-move="down" data-index="${index}" title="Turunkan" ${disabledDown}>${ICONS.down}</button>
                            <button data-delete-id="${item.id}" title="Delete">${ICONS.trash}</button>
                        </div>
                    ` : ''}
                    <div class="gallery-reaction-overlay">
                        <button class="gallery-reaction-btn ${myReaction === 'like' ? 'is-active' : ''}" data-reaction="like" title="Like">${ICONS.like}</button>
                        <span class="gallery-reaction-count">${item.likes || 0}</span>
                        <button class="gallery-reaction-btn ${myReaction === 'dislike' ? 'is-active' : ''}" data-reaction="dislike" title="Dislike">${ICONS.dislike}</button>
                        <span class="gallery-reaction-count">${item.dislikes || 0}</span>
                        <button class="gallery-reaction-btn" data-open-comment title="Comment">${ICONS.comment}</button>
                    </div>
                `;
                gridEl.appendChild(cell);
            });
        }

        function escapeAttr(str) { return (str || '').replace(/"/g, '&quot;'); }

        /**
         * Viewer gambar custom dengan dukungan zoom (scroll wheel di
         * desktop, pinch-gesture di mobile) dan pan (drag saat sedang
         * di-zoom). Dibuat sebagai overlay penuh layar sendiri, BUKAN lewat
         * browser Fullscreen API (element.requestFullscreen()) -- API
         * native itu tidak memungkinkan kita menyisipkan kontrol zoom
         * kustom di dalamnya, jadi pendekatan overlay manual ini yang
         * dipakai supaya interaksi zoom/pan bisa diimplementasikan penuh.
         */
        let _viewerScale = 1;
        let _viewerTranslateX = 0;
        let _viewerTranslateY = 0;
        const VIEWER_MIN_SCALE = 0.3;
        const VIEWER_MAX_SCALE = 4;

        function ensureImageViewerExists() {
            if (document.getElementById('image-viewer-overlay')) return;

            const wrapper = document.createElement('div');
            wrapper.innerHTML = `
                <div id="image-viewer-overlay" class="image-viewer-overlay">
                    <button id="image-viewer-close" class="image-viewer-close" title="Tutup">${ICONS.close || '&times;'}</button>
                    <div class="image-viewer-canvas" id="image-viewer-canvas">
                        <img id="image-viewer-img" alt="Gambar diperbesar" draggable="false"/>
                    </div>
                    <div class="image-viewer-hint">Scroll atau cubit untuk zoom &middot; seret untuk geser</div>
                </div>
            `.trim();
            document.body.appendChild(wrapper.firstChild);

            const overlay = document.getElementById('image-viewer-overlay');
            const canvas = document.getElementById('image-viewer-canvas');
            const img = document.getElementById('image-viewer-img');

            function applyTransform() {
                img.style.transform = `translate(${_viewerTranslateX}px, ${_viewerTranslateY}px) scale(${_viewerScale})`;
            }

            function resetTransform() {
                _viewerScale = 1;
                _viewerTranslateX = 0;
                _viewerTranslateY = 0;
                applyTransform();
            }

            function clampScale(s) {
                return Math.min(VIEWER_MAX_SCALE, Math.max(VIEWER_MIN_SCALE, s));
            }

            // Zoom lewat scroll wheel (desktop/trackpad)
            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                const delta = e.deltaY < 0 ? 0.12 : -0.12;
                _viewerScale = clampScale(_viewerScale + delta);
                applyTransform();
            }, { passive: false });

            // Pan lewat drag mouse, hanya berlaku saat sedang di-zoom (scale != 1)
            let isDragging = false;
            let dragStartX = 0, dragStartY = 0;
            canvas.addEventListener('mousedown', (e) => {
                if (_viewerScale === 1) return;
                isDragging = true;
                dragStartX = e.clientX - _viewerTranslateX;
                dragStartY = e.clientY - _viewerTranslateY;
                canvas.style.cursor = 'grabbing';
            });
            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                _viewerTranslateX = e.clientX - dragStartX;
                _viewerTranslateY = e.clientY - dragStartY;
                applyTransform();
            });
            window.addEventListener('mouseup', () => {
                isDragging = false;
                canvas.style.cursor = '';
            });

            // Pinch-to-zoom untuk touch (mobile) -- menghitung jarak antar 2 jari
            let pinchStartDist = 0;
            let pinchStartScale = 1;
            let touchStartX = 0, touchStartY = 0;
            canvas.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    pinchStartDist = Math.hypot(dx, dy);
                    pinchStartScale = _viewerScale;
                } else if (e.touches.length === 1 && _viewerScale !== 1) {
                    touchStartX = e.touches[0].clientX - _viewerTranslateX;
                    touchStartY = e.touches[0].clientY - _viewerTranslateY;
                }
            }, { passive: true });
            canvas.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    const dist = Math.hypot(dx, dy);
                    _viewerScale = clampScale(pinchStartScale * (dist / pinchStartDist));
                    applyTransform();
                } else if (e.touches.length === 1 && _viewerScale !== 1) {
                    _viewerTranslateX = e.touches[0].clientX - touchStartX;
                    _viewerTranslateY = e.touches[0].clientY - touchStartY;
                    applyTransform();
                }
            }, { passive: false });

            // Double-click / double-tap untuk reset zoom dengan cepat
            canvas.addEventListener('dblclick', resetTransform);

            document.getElementById('image-viewer-close').addEventListener('click', closeImageViewer);
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) closeImageViewer();
            });

            overlay._resetTransform = resetTransform;
        }

        function openImageViewer(imageUrl) {
            ensureImageViewerExists();
            const overlay = document.getElementById('image-viewer-overlay');
            const img = document.getElementById('image-viewer-img');
            img.src = imageUrl;
            overlay._resetTransform();
            overlay.classList.add('is-open');
            document.body.style.overflow = 'hidden';
        }

        function closeImageViewer() {
            const overlay = document.getElementById('image-viewer-overlay');
            if (overlay) overlay.classList.remove('is-open');
            document.body.style.overflow = '';
        }

        gridEl.addEventListener('click', async (e) => {
            const fullscreenBtn = e.target.closest('[data-fullscreen]');
            if (fullscreenBtn) {
                const img = fullscreenBtn.previousElementSibling;
                if (img && img.tagName === 'IMG') {
                    openImageViewer(img.src);
                }
                return;
            }

            const delBtn = e.target.closest('[data-delete-id]');
            if (delBtn) {
                if (!confirm('Hapus gambar ini?')) return;
                try {
                    await softDeleteEntry('gallery_items', delBtn.dataset.deleteId);
                } catch (err) {
                    console.error('Gagal menghapus gambar:', err);
                    alert('Gagal menghapus. Cek konsol untuk detail.');
                }
                return;
            }

            const orderBtn = e.target.closest('[data-move]');
            if (orderBtn) {
                if (orderBtn.disabled) return;
                const index = parseInt(orderBtn.dataset.index, 10);
                const direction = orderBtn.dataset.move;
                orderBtn.disabled = true;
                try {
                    await moveEntryOrder('gallery_items', currentItems, index, direction);
                } catch (err) {
                    console.error('Gagal memindahkan urutan:', err);
                    alert('Gagal memindahkan urutan. Cek console untuk detail.');
                    orderBtn.disabled = false;
                }
                return;
            }

            const reactionBtn = e.target.closest('.gallery-reaction-btn[data-reaction]');
            if (reactionBtn) {
                const cell = reactionBtn.closest('[data-id]');
                const itemId = cell.dataset.id;
                const reactionType = reactionBtn.dataset.reaction;
                reactionBtn.disabled = true;
                try {
                    const newReaction = await toggleReaction('gallery_items', itemId, reactionType);
                    if (newReaction === reactionType) {
                        reactionBtn.classList.remove('pop-animate');
                        void reactionBtn.offsetWidth;
                        reactionBtn.classList.add('pop-animate');
                    }
                } catch (err) {
                    console.error('Gagal update reaksi:', err);
                } finally {
                    reactionBtn.disabled = false;
                }
                return;
            }

            const openCommentBtn = e.target.closest('[data-open-comment]');
            if (openCommentBtn) {
                const cell = openCommentBtn.closest('[data-id]');
                openCommentSheet('gallery', cell.dataset.id);
                return;
            }
        });

        db.collection('gallery_items')
            .orderBy('order', 'asc')
            .onSnapshot((snapshot) => {
                const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderGallery(items);
            }, (error) => {
                console.error('Gagal memuat gallery:', error);
                gridEl.style.display = 'block';
                gridEl.innerHTML = `<p class="text-error font-body-md py-4">Gagal memuat data. Cek konfigurasi Firebase di firebase-config.js</p>`;
            });

        // ---------- Modal upload ----------
        function openModal() {
            modal.classList.add('is-open');
            document.body.style.overflow = 'hidden';
        }
        function closeModal() {
            modal.classList.remove('is-open');
            document.body.style.overflow = '';
            resetDropzone();
        }
        function resetDropzone() {
            selectedFile = null;
            fileInput.value = '';
            previewImg.classList.add('hidden');
            dropzoneLabel.classList.remove('hidden');
            uploadBtn.disabled = true;
        }

        addNewBtn.addEventListener('click', () => { resetDropzone(); openModal(); });
        document.getElementById('modal-close').addEventListener('click', closeModal);
        document.getElementById('modal-cancel').addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

        dropzone.addEventListener('click', () => fileInput.click());
        dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('is-dragover'); });
        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('is-dragover'));
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('is-dragover');
            if (e.dataTransfer.files[0]) handleFileSelect(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', () => {
            if (fileInput.files[0]) handleFileSelect(fileInput.files[0]);
        });

        function handleFileSelect(file) {
            if (!file.type.startsWith('image/')) {
                alert('Hanya file gambar yang diperbolehkan.');
                return;
            }
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                previewImg.classList.remove('hidden');
                dropzoneLabel.classList.add('hidden');
            };
            reader.readAsDataURL(file);
            uploadBtn.disabled = false;
        }

        uploadBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            uploadBtn.disabled = true;
            uploadBtn.textContent = 'Mengompres...';

            try {
                const imageUrl = await compressImageToDataUrl(selectedFile);
                uploadBtn.textContent = 'Menyimpan...';
                const countSnap = await db.collection('gallery_items').get();
                await db.collection('gallery_items').add({
                    imageUrl,
                    order: countSnap.size,
                    likes: 0,
                    dislikes: 0,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                closeModal();
            } catch (err) {
                console.error('Gagal upload gambar — kode:', err.code, '| pesan:', err.message);
                if (err.code === 'permission-denied') {
                    alert('Sesi admin sepertinya sudah tidak valid. Klik nama 5x lagi dan masukkan PIN ulang.');
                } else if (err.message && err.message.toLowerCase().includes('cors')) {
                    alert('Upload diblokir kebijakan CORS Firebase Storage. Bucket Storage butuh konfigurasi CORS eksplisit untuk domain ini — lihat README bagian Troubleshooting.');
                } else if (err.message && err.message.toLowerCase().includes('gambar')) {
                    alert(`Gagal memproses gambar: ${err.message}`);
                } else {
                    alert(`Gagal upload: ${err.code || err.message || 'error tidak diketahui'}. Cek console untuk detail.`);
                }
            } finally {
                uploadBtn.textContent = 'Upload';
                uploadBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
